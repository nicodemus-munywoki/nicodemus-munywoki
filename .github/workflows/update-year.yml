name: Update Copyright Year

on:
  schedule:
    - cron: '0 0 1 1 *' # Runs every Jan 1 at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-year:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update year in README
        run: |
          YEAR=$(date +'%Y')
          sed -i "s/<!--COPYRIGHT_START-->.*<!--COPYRIGHT_END-->/<!--COPYRIGHT_START-->© ${YEAR}<!--COPYRIGHT_END-->/g" README.md
      - name: Commit change if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add README.md && git commit -m "chore: update copyright year" && git push)
